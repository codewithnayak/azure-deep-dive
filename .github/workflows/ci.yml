name: IELS FIR API CI

on:
  push:
    branches: [main]
    paths:
      - "create-fir-api/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "create-fir-api/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    name: Build and Test FIR API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./create-fir-api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore create-fir-api.slnx

      - name: Build FIR API
        run: dotnet build create-fir-api.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test create-fir-api.slnx --configuration Release --no-build

      - name: Build FIR API Docker Image
        run: |
          docker build \
            -t iels-fir-api:${{ github.sha }} \
            -f FirApi/Dockerfile \
            .
      - name: Login to Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            iels-fir-api:${{ github.sha }} \
            ${{ vars.ACR_NAME }}.azurecr.io/iels-fir-api:${{ github.sha }}

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ${{ vars.ACR_NAME }}.azurecr.io/iels-fir-api:${{ github.sha }}
